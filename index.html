/* ---------------- CHALLENGE ---------------- */
const CHALLENGE_MENU = [
  {type:'trivia', icon:'\ud83c\udfaf', title:'Quick Quiz', sub:'30 seconds, test what you know'},
  {type:'mystery', icon:'\ud83d\udd75\ufe0f', title:'Mystery', sub:'Unlock clues, solve the case'},
  {type:'challenge', icon:'\ud83d\udcb0', title:'Simulation', sub:'Run a real decision scenario'},
  {type:'debate', icon:'\ud83e\udde0', title:'Debate', sub:'Pick a side, see both views'},
  {type:'versus', icon:'\ud83c\udfb2', title:'Versus', sub:'Fast head-to-head call'},
];
function pickChallengeTopic(){
  const prefs = topAffinities(2);
  if(prefs.length) return prefs.join(' and ');
  const due = dueReviews(1);
  if(due.length) return due[0].term;
  return 'something genuinely interesting, your pick';
}
async function launchChallenge(type){
  showToast('Building your challenge\u2026');
  try{
    const card = await fetchTargeted(type, pickChallengeTopic(), '');
    state.feed.push(card);
    const label = card.word || card.hook; if(label) state.seenTitles.push(label);
    persist('feed', state.feed.slice(-80));
    switchView('home');
    requestAnimationFrame(()=>{
      const el2 = [...document.querySelectorAll('.snap-card')].find(e=>e.dataset.id===card.id);
      if(el2) el2.scrollIntoView({behavior:'smooth'});
    });
  }catch(e){ showToast('Could not load a challenge, try again'); }
}
async function launchTargetedApplication(item){
  showToast('Building a challenge on '+item.term+'\u2026');
  try{
    const applyType = ['trivia','mystery','versus'][Math.floor(Math.random()*3)];
    const card = await fetchTargeted(applyType, 'a question that requires the learner to APPLY or IDENTIFY this concept in a new, different situation \u2014 not just define it: "'+item.term+'" ('+item.definition+')', '');
    card.appliesConceptKey = normKey(item.term);
    card.appliesConceptTerm = item.term;
    state.feed.push(card);
    persist('feed', state.feed.slice(-80));
    switchView('home');
    requestAnimationFrame(()=>{
      const el2 = [...document.querySelectorAll('.snap-card')].find(e=>e.dataset.id===card.id);
      if(el2) el2.scrollIntoView({behavior:'smooth'});
    });
  }catch(e){ showToast('Could not build that challenge, try again'); }
}
function renderChallenge(){
  const el = document.getElementById('view-challenge');
  el.innerHTML = '<p class="explore-title display">\u26a1 Challenge</p><p class="explore-sub">Test yourself on what you already know.</p>';
  CHALLENGE_MENU.forEach(item=>{
    const tile = document.createElement('div'); tile.className='hub-tile';
    tile.innerHTML = '<span class="hub-icon">'+item.icon+'</span><div><div class="hub-title">'+item.title+'</div><div class="hub-sub">'+item.sub+'</div></div>';
    tile.onclick = ()=>launchChallenge(item.type);
    el.appendChild(tile);
  });

  const eligibleBoss = KNOWLEDGE_MAP.filter(d=>{ const a = domainMasteryAvg(d); return tierFromMastery(a)==='gold' && a.count>=3; });
  const bossTile = document.createElement('div'); bossTile.className='hub-tile'+(eligibleBoss.length===0?' locked':'');
  if(eligibleBoss.length===0){
    const closest = KNOWLEDGE_MAP.map(d=>({d, a:domainMasteryAvg(d)})).filter(x=>x.a.count>0).sort((a,b)=>b.a.avg-a.a.avg)[0];
    const hint = closest ? closest.d.id+': '+closest.a.count+' concept'+(closest.a.count===1?'':'s')+', '+closest.a.avg+'% avg mastery (needs 3 concepts + 70%+ avg in one domain)' : 'Earn a few concepts in one domain to unlock this';
    bossTile.innerHTML = '<span class="hub-icon">\ud83c\udfc6</span><div><div class="hub-title">Boss Battle</div><div class="hub-sub">'+hint+'</div></div>';
  } else {
    bossTile.innerHTML = '<span class="hub-icon">\ud83c\udfc6</span><div><div class="hub-title">Boss Battle</div><div class="hub-sub">Test everything you know about '+eligibleBoss[0].id+'</div></div>';
    bossTile.onclick = ()=>launchChallenge('boss');
  }
  el.appendChild(bossTile);
}

/* ---------------- MEMORY ---------------- */
let selectedRarityTier = null;
let selectedRarityDomain = null;

  const due = dueReviews(999);

  const dueTitle = document.createElement('p'); dueTitle.style.fontWeight='700'; dueTitle.style.margin='0.4rem 0 0.7rem'; dueTitle.textContent = 'Due Now \u2014 ' + due.length;
  el.appendChild(dueTitle);
  if(due.length===0){
    const p = document.createElement('p'); p.style.color='var(--text-soft)'; p.style.fontSize='0.85rem'; p.style.marginBottom='1.3rem';

  } else {
    due.slice(0,10).forEach(item=>{

  el.appendChild(comingTitle);
  const comingGrid = document.createElement('div'); comingGrid.className='stat-grid';
  [[tomorrow,'Tomorrow'],[week,'This week'],[later,'Later'],[due.length,'Due now']].forEach(([num,lbl])=>{

  });

  const rarityTitle = document.createElement('p'); rarityTitle.style.fontWeight='700'; rarityTitle.style.margin='1.2rem 0 0.6rem'; rarityTitle.textContent = 'By Rarity';
  el.appendChild(rarityTitle);
  const bankValues = Object.values(state.memoryBank);
  const rarityGrid = document.createElement('div'); rarityGrid.className='stat-grid';
  RARITY_TIERS.forEach(tier=>{

    const box = document.createElement('div'); box.className='stat-box'; box.style.cursor='pointer';
    box.style.background = 'radial-gradient(circle at 75% 15%, '+RARITY_GLOW[tier]+', transparent 60%), var(--surface)';
    box.innerHTML = '<div class="num" style="color:'+RARITY_COLOR[tier]+'">'+count+'</div><div class="lbl">'+tier+'</div>';

  el.appendChild(knowTitle);

  const totalLine = document.createElement('p'); totalLine.style.color='var(--gold)'; totalLine.style.fontWeight='700'; totalLine.style.fontSize='0.95rem'; totalLine.style.margin='0 0 0.8rem';
  totalLine.textContent = mastered + ' concepts mastered \u00b7 ' + Object.keys(state.memoryBank).length + ' total';

/* ---------------- PROFILE ---------------- */
function renderProfile(){
  const el = document.getElementById('view-profile');
  el.innerHTML = '';
  const charHeader = document.createElement('div'); charHeader.className='char-header';
  charHeader.innerHTML = '<div class="char-avatar">\ud83e\udde0</div><div class="char-level display">Level '+levelOf(state.xp)+'</div><div class="char-title">'+levelTitle(levelOf(state.xp))+'</div><div class="char-xp">'+state.xp+' / '+(levelOf(state.xp)*150)+' XP</div>';

  const barOuter = document.createElement('div'); barOuter.className='xp-bar-outer';
  const barInner = document.createElement('div'); barInner.className='xp-bar-inner'; barInner.style.width = Math.round((xpIntoLevel(state.xp)/150)*100)+'%';
  barOuter.appendChild(barInner); el.appendChild(barOuter);

  const dimGrid = document.createElement('div'); dimGrid.className='stat-grid'; dimGrid.style.marginBottom='1.4rem';
  [
    ['\ud83e\udde0 '+Object.keys(state.memoryBank).length, 'Knowledge \u2014 concepts'],
    ['\ud83d\udd25 '+formatFocus(state.focusBestSec), 'Focus \u2014 longest streak'],
  ].forEach(([num,lbl])=>{
    const box = document.createElement('div'); box.className='stat-box';
    box.innerHTML = '<div class="num" style="font-size:1.05rem">'+num+'</div><div class="lbl">'+lbl+'</div>';
    dimGrid.appendChild(box);
  });
  el.appendChild(dimGrid);

  const focusSection = document.createElement('div'); focusSection.className='profile-section';
  focusSection.innerHTML = '<h4>Focus training</h4>';
  const ladderWrap = document.createElement('div'); ladderWrap.className='focus-ladder';
  FOCUS_MILESTONES.forEach(m=>{
    const pip = document.createElement('div'); pip.className='focus-pip'+(state.focusBestSec>=m?' hit':'');

  });
  focusSection.appendChild(ladderWrap);
  const focusNote = document.createElement('p'); focusNote.style.color='var(--text-soft)'; focusNote.style.fontSize='0.78rem'; focusNote.style.margin='0.6rem 0 0';
  focusNote.textContent = 'Your longest unbroken run of activity, ever \u2014 keeps interacting for 90s+ without a gap and it grows.';
  focusSection.appendChild(focusNote);
  el.appendChild(focusSection);

  const analyticsSection = document.createElement('div'); analyticsSection.className='profile-section';
  analyticsSection.innerHTML = '<h4>Your Brain</h4>';
  const monthStart = new Date(); monthStart.setDate(1); monthStart.setHours(0,0,0,0);
  const conceptsThisMonth = Object.values(state.memoryBank).filter(m=>m.createdAt>=monthStart.getTime()).length;
  const ms2 = state.memoryStats;
  const recallPct = ms2.reviewed ? Math.round((ms2.remembered/ms2.reviewed)*100) : null;
  const acc = recentAccuracy();
  const conceptsMastered2 = Object.values(state.memoryBank).filter(m=>m.mastery>=80).length;
  const forgetting = Object.values(state.memoryBank).filter(m=>m.mastery<40 && m.nextReview<=Date.now()).length;
  const domainStats = KNOWLEDGE_MAP.map(d=>({id:d.id, ...domainMasteryAvg(d)})).filter(d=>d.count>0);
  let strongest = null, weakest = null;
  if(domainStats.length){
    strongest = domainStats.reduce((a,b)=> b.avg>a.avg ? b : a);
    weakest = domainStats.reduce((a,b)=> b.avg<a.avg ? b : a);
  }
  const agrid = document.createElement('div'); agrid.className='stat-grid';
  [
    [conceptsThisMonth, 'Learned this month'],
    [recallPct!==null ? recallPct+'%' : '\u2014', 'Recall rate (week)'],
    [acc!==null ? Math.round(acc*100)+'%' : '\u2014', 'Recent accuracy'],
    [conceptsMastered2, 'Concepts mastered'],
    [state.connectsMade, 'Connections made'],
    [forgetting, 'Currently forgetting'],
  ].forEach(([num,lbl])=>{
    const box = document.createElement('div'); box.className='stat-box';
    box.innerHTML = '<div class="num">'+num+'</div><div class="lbl">'+lbl+'</div>';
    agrid.appendChild(box);
  });
  analyticsSection.appendChild(agrid);
  if(strongest && weakest){
    const line = document.createElement('p'); line.style.fontSize='0.85rem'; line.style.color='var(--text-soft)'; line.style.margin='0.9rem 0 0';
    line.innerHTML = 'Strongest area: <strong style="color:var(--gold)">'+strongest.id+'</strong> ('+strongest.avg+'%) \u00b7 Weakest: <strong style="color:var(--text)">'+weakest.id+'</strong> ('+weakest.avg+'%)';
    analyticsSection.appendChild(line);
  }
  el.appendChild(analyticsSection);

  resetDailyIfNeeded();
  const streakSection = document.createElement('div'); streakSection.className='profile-section';
  streakSection.innerHTML = '<h4>Thinking streak \u2014 ' + state.streak.count + ' days</h4>';
  const row = document.createElement('div'); row.className='streak-row';
  const dayLabels = ['M','T','W','T','F','S','S'];
  const filled = Math.min(state.streak.count, 7);
  for(let i=0;i<7;i++){
    const dot = document.createElement('div'); dot.className='streak-dot'+(i>=7-filled?' on':'');
    dot.textContent = dayLabels[i];
    row.appendChild(dot);
  }
  streakSection.appendChild(row);
  const todayLine = document.createElement('p'); todayLine.style.color='var(--text-soft)'; todayLine.style.fontSize='0.8rem'; todayLine.style.margin='0.6rem 0 0';
  const d = state.daily;
  todayLine.textContent = 'Today: ' + d.reveals + ' predictions \u00b7 ' + (d.trivia+d.challenge) + ' quick answers \u00b7 ' + d.french + ' French sentences';
  streakSection.appendChild(todayLine);
  el.appendChild(streakSection);

  const statsSection = document.createElement('div'); statsSection.className='profile-section';
  statsSection.innerHTML = '<h4>Your stats</h4>';
  const grid = document.createElement('div'); grid.className='stat-grid';
  const accuracy = state.triviaTotal ? Math.round((state.triviaCorrect/state.triviaTotal)*100) : 0;
  [
    [state.frenchChecks, 'French sentences'],
    [state.saved.length, 'Cards saved'],
    [accuracy+'%', 'Trivia accuracy'],
    [state.triviaBestStreak, 'Best trivia streak'],
  ].forEach(([num,lbl])=>{
    const box = document.createElement('div'); box.className='stat-box';
    box.innerHTML = '<div class="num">'+num+'</div><div class="lbl">'+lbl+'</div>';
    grid.appendChild(box);
  });

  el.appendChild(statsSection);

  const mapSection = document.createElement('div'); mapSection.className='profile-section';
  mapSection.innerHTML = '<h4>Knowledge map</h4>';
  const mgrid = document.createElement('div'); mgrid.className='map-grid';
  KNOWLEDGE_MAP.forEach(d2=>{
    const avgObj = domainMasteryAvg(d2);
    const tier = tierFromMastery(avgObj);
    const node = document.createElement('div'); node.className='map-node '+tier;
    node.style.setProperty('--node-color', d2.color);
    const tierLabel = tier==='locked' ? '\ud83d\udd12 Not started' : avgObj.avg+'% avg mastery \u00b7 '+avgObj.count+' concepts';
    node.innerHTML = '<div class="map-name">'+d2.id+'</div><div class="map-tier">'+tierLabel+'</div>';
    mgrid.appendChild(node);
  });
  mapSection.appendChild(mgrid);
  el.appendChild(mapSection);

  const collectionsSection = document.createElement('div'); collectionsSection.className='profile-section';
  collectionsSection.innerHTML = '<h4>Collections</h4>';
  let anyCollection = false;
  function renderCollectionBox(name, color, items){
    if(items.length===0) return;
    anyCollection = true;
    const box = document.createElement('div'); box.style.marginBottom='0.9rem';
    const title = document.createElement('p'); title.style.fontWeight='700'; title.style.fontSize='0.85rem'; title.style.color=color; title.style.margin='0 0 0.4rem';
    title.textContent = name + ' \u2014 ' + items.length + ' discovered';
    box.appendChild(title);
    items.slice(0,8).forEach(it=>{
      const mastered = it.mastery>=80;
      const row = document.createElement('div'); row.style.display='flex'; row.style.justifyContent='space-between'; row.style.fontSize='0.82rem'; row.style.padding='0.3rem 0'; row.style.borderBottom='1px solid var(--border)';
      row.innerHTML = '<span style="'+(mastered?'color:var(--gold);font-weight:700;':'')+'">'+(mastered?'\u2b50 ':'')+it.term+'</span><span style="color:var(--text-soft)">'+stageOf(it.mastery)+' \u00b7 '+it.mastery+'%</span>';
      box.appendChild(row);
    });
    if(items.length>8){
      const more = document.createElement('p'); more.style.fontSize='0.76rem'; more.style.color='var(--text-soft)'; more.style.margin='0.3rem 0 0';

      box.appendChild(more);
    }
    collectionsSection.appendChild(box);

  KNOWLEDGE_MAP.forEach(d2=>{
    renderCollectionBox(d2.id, d2.color, itemsInDomain(d2).sort((a,b)=>b.mastery-a.mastery));
  });
  state.customCollections.forEach(cat=>{
    renderCollectionBox('\ud83c\udf10 '+cat, '#9C98AE', itemsInCollection(cat).sort((a,b)=>b.mastery-a.mastery));
  });
  if(!anyCollection){
    const p = document.createElement('p'); p.style.color='var(--text-soft)'; p.style.fontSize='0.85rem';
    p.textContent = 'Get things right on Home to start building your collections.';
    collectionsSection.appendChild(p);
  }
  el.appendChild(collectionsSection);

  resetMemoryStatsIfNeeded();
  const savedSection = document.createElement('div'); savedSection.className='profile-section';
  savedSection.innerHTML = '<h4>Saved (' + state.saved.length + ')</h4>';
  if(state.saved.length===0){
    const p = document.createElement('p'); p.style.color='var(--text-soft)'; p.style.fontSize='0.85rem';
    p.textContent = 'Tap the heart on any card to keep it here.';
    savedSection.appendChild(p);
  } else {
    state.saved.slice().reverse().slice(0,10).forEach(card=>{
      const c = document.createElement('div'); c.className='lib-card';
      const title = card.word || card.hook || card.title;
      c.innerHTML = '<h3>'+title+'</h3>';
      const body = card.body || card.explanation || card.meaning || '';
      if(body){ const p = document.createElement('p'); p.className='body-text'; p.textContent = body; c.appendChild(p); }
      const unsaveBtn = document.createElement('button'); unsaveBtn.textContent = 'Remove';
      unsaveBtn.onclick = ()=>{
        const idx = state.saved.findIndex(s=>s.id===card.id);
        if(idx>=0) state.saved.splice(idx,1);
        persist('saved-cards', state.saved);
        renderProfile();

      c.appendChild(unsaveBtn);

      const more = document.createElement('p'); more.style.color='var(--text-soft)'; more.style.fontSize='0.78rem';
      more.textContent = '+' + (state.saved.length-10) + ' more saved';

  el.appendChild(savedSection);

  const collectSection = document.createElement('div'); collectSection.className='profile-section';
  collectSection.innerHTML = '<h4>Rarity collection</h4>';
  const cgrid = document.createElement('div'); cgrid.className='collect-grid';
  RARITY_TIERS.forEach(tier=>{
    const got = state.collectedTiers.includes(tier);
    const chip = document.createElement('div'); chip.className='collect-chip'+(got?' got':'');
    chip.style.setProperty('--rarity-color', RARITY_COLOR[tier]);
    chip.textContent = got ? tier+' \u2713' : tier+' ('+(state.rarityStreak[tier]||0)+'/3)';
    cgrid.appendChild(chip);
  });
  collectSection.appendChild(cgrid);
  const collectNote = document.createElement('p'); collectNote.style.color='var(--text-soft)'; collectNote.style.fontSize='0.78rem'; collectNote.style.margin='0.6rem 0 0';
  collectNote.textContent = 'Answer 3 cards of a rarity correctly in a row to collect it.';
  collectSection.appendChild(collectNote);
  el.appendChild(collectSection);

  const badgeSection = document.createElement('div'); badgeSection.className='profile-section';
  badgeSection.innerHTML = '<h4>Badges</h4>';
  const bgrid = document.createElement('div'); bgrid.className='badge-grid';
  BADGES.forEach(b=>{
    const tile = document.createElement('div'); tile.className='badge-tile'+(state.unlockedBadges.includes(b.id)?' unlocked':'');
    tile.textContent = b.label;
    bgrid.appendChild(tile);
  });
  badgeSection.appendChild(bgrid);
  el.appendChild(badgeSection);
}

/* ---------------- NAV / VIEW SWITCH ---------------- */
function switchView(name){
  state.view = name;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===name));
  if(name==='explore') renderExplore();
  else if(name==='challenge') renderChallenge();
  else if(name==='memory') renderMemory();
  else if(name==='profile') renderProfile();
  else if(name==='home') renderHome();
}

async function maybeResetFeed(){
  let sessionFresh = true;
  try{ sessionFresh = !sessionStorage.getItem('fn_session_active'); }catch(e){}
  let staleByTime = false;
  try{
    const r = await window.storage.get('last-active-at');
    if(r && r.value){
      const last = parseInt(r.value, 10);
      if(!isNaN(last) && (Date.now() - last) > 3600000) staleByTime = true;
    }
  }catch(e){}
  if(sessionFresh || staleByTime){
    state.feed = [];
    state.seenTitles = [];
    await persist('feed', []);
    await persist('seen-titles', []);
  }
  try{ sessionStorage.setItem('fn_session_active','1'); }catch(e){}
  persist('last-active-at', Date.now());
}

async function init(){
  await loadStorage();
  await maybeResetFeed();
  checkStreak();
  document.querySelectorAll('.nav-btn').forEach(b=>{ b.onclick = ()=>switchView(b.dataset.view); });
  document.getElementById('overlay-close').onclick = closeOverlay;
  renderHome();
  if(state.feed.length===0){
    await loadMore(1, false);
    loadMore(2, true);
  }
}
init();
</script>
