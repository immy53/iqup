<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IQ Up</title>
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IQ Up">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0B12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0B12; --surface:#15151F; --surface-2:#1D1D2B; --border:#2A2A3A;
    --text:#F5F3ED; --text-soft:#9C98AE;
    --gold:#E8C468; --gold-dark:#B98F2E; --gold-tint:rgba(232,196,104,0.12);
    --purple:#8B7CF6; --purple-tint:rgba(139,124,246,0.16);
    --pink:#FF6FA5; --pink-tint:rgba(255,111,165,0.14);
    --blue:#4FB3E8; --blue-tint:rgba(79,179,232,0.14);
    --green:#39D98A; --green-tint:rgba(57,217,138,0.14);
    --orange:#FFA85C; --orange-tint:rgba(255,168,92,0.14);
    --red:#FF6B6B; --red-tint:rgba(255,107,107,0.14);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg);}
  #app{ min-height:100vh; height:100vh; font-family:'Inter', sans-serif; color:var(--text); display:flex; flex-direction:column; overflow:hidden; }
  .display{ font-family:'Poppins', sans-serif; }
  .views{ flex:1; position:relative; overflow:hidden; }
  .view{ position:absolute; inset:0; overflow-y:auto; display:none; }
  .view.active{ display:block; }

  /* ---- HOME (scrollable list) ---- */
  #view-home{ padding:0; scroll-snap-type:y mandatory; overflow-y:auto; height:100%; }
  .home-topbar{
    position:sticky; top:0; z-index:15; display:flex; align-items:center; justify-content:space-between;
    padding:0.9rem 1.1rem 0.7rem; background:linear-gradient(180deg, var(--bg) 75%, rgba(11,11,18,0));
  }
  .home-label{ font-size:0.9rem; font-weight:700; color:var(--gold); letter-spacing:0.02em; }
  .home-substream{ display:flex; gap:0.4rem; }
  .diff-btn{ font-size:0.7rem; font-weight:600; padding:0.32rem 0.6rem; border-radius:14px; border:1px solid var(--border); background:var(--surface); color:var(--text-soft); cursor:pointer; }
  .diff-btn.active{ background:var(--gold); border-color:var(--gold); color:#3A2C00; }
  .snap-card{
    position:relative; min-height:100vh; scroll-snap-align:start; scroll-snap-stop:always;
    display:flex; flex-direction:column; justify-content:center;
    padding:1.6rem 1.4rem 2.6rem; box-sizing:border-box;
    background: radial-gradient(circle at 25% 15%, var(--tag-glow, var(--purple-tint)), transparent 55%), var(--bg);
    border-top:1px solid var(--border);
  }
  .snap-tag{
    font-size:0.8rem; font-weight:700; letter-spacing:0.04em; text-transform:uppercase;
    color:var(--tag-color, var(--purple)); margin-bottom:1.1rem; display:flex; align-items:center; gap:0.6rem; flex-wrap:wrap;
  }
  .snap-tag .cat{ color:var(--text-soft); font-weight:600; text-transform:none; letter-spacing:0; }
  .stat-stars{ margin:0 0 1rem; }
  .stat-star-row{ display:flex; justify-content:space-between; font-size:0.78rem; color:var(--text-soft); margin-bottom:0.15rem; max-width:220px; }
  .stat-star-icons{ color:var(--gold); letter-spacing:0.05em; }
  .snap-card h2{ font-family:'Poppins',sans-serif; font-size:1.85rem; font-weight:700; line-height:1.28; margin:0 0 1rem; }
  .snap-card .body-text{ font-size:1.15rem; line-height:1.6; color:#DAD6E8; margin:0 0 0.9rem; }
  .snap-card .sub{ font-size:0.95rem; color:var(--text-soft); margin:0 0 0.6rem; font-weight:500; }
  .snap-card .example{ background:var(--surface-2); border-left:3px solid var(--tag-color, var(--purple)); border-radius:10px; padding:0.9rem 1rem; margin:0.6rem 0 0.9rem; font-size:1.05rem; line-height:1.5; }
  .snap-card .why{ font-size:0.9rem; color:var(--text-soft); margin:0.4rem 0 0; }
  .snap-card .takeaway{ font-size:1rem; font-weight:600; background:var(--surface-2); color:var(--gold); padding:0.75rem 0.9rem; border-radius:12px; margin:0.7rem 0 0; }
  .action-col{ display:flex; justify-content:flex-end; margin-top:1rem; }
  .action-btn{ width:3.2rem; height:3.2rem; border-radius:50%; background:var(--surface-2); border:1px solid var(--border); color:var(--pink); font-size:1.4rem; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .action-btn.saved{ background:var(--pink-tint); color:var(--pink); }
  .reveal-btn, .quiz-btn, button.primary{
    font-family:'Inter',sans-serif; font-size:1.05rem; font-weight:700; border:none; border-radius:16px; cursor:pointer; padding:1rem 1.3rem;
  }
  .reveal-btn{ background:var(--gold); color:#3A2C00; align-self:stretch; }
  .quiz-btn{ background:var(--surface-2); color:var(--green); align-self:flex-start; font-size:0.9rem; padding:0.7rem 1rem; }
  button.primary{ background:linear-gradient(135deg, var(--purple), var(--pink)); color:#fff; align-self:stretch; }
  button:disabled{ opacity:0.5; }
  textarea{
    width:100%; min-height:70px; resize:vertical; font-family:'Inter',sans-serif; font-size:1.05rem; color:var(--text);
    background:var(--surface-2); border:1px solid var(--border); border-radius:14px; padding:0.8rem 1rem; margin-bottom:0.8rem; box-sizing:border-box;
  }
  textarea:focus{ outline:none; border-color:var(--purple); }
  textarea:disabled{ opacity:0.75; }
  .prompt-line{ font-size:1rem; color:var(--text-soft); font-weight:500; margin:0 0 0.7rem; }
  .feedback{ margin-top:0.7rem; padding:0.9rem 1rem; border-radius:14px; background:var(--surface-2); font-size:1rem; line-height:1.55; color:var(--text); border-left:3px solid var(--gold); }
  .feedback .corrected{ font-weight:700; margin-bottom:0.3rem; color:var(--gold); }
  .choice-btn{
    display:block; width:100%; text-align:left; background:var(--surface-2); color:var(--text); border:1.5px solid var(--border);
    border-radius:16px; padding:1.1rem 1.2rem; margin-bottom:0.7rem; font-weight:600; font-size:1.05rem; cursor:pointer; box-sizing:border-box;
  }
  .choice-btn:disabled{ opacity:1; cursor:default; }
  .choice-btn.correct{ background:var(--green-tint); border-color:var(--green); color:var(--green); font-weight:700; }
  .choice-btn.incorrect{ background:var(--red-tint); border-color:var(--red); color:var(--red); font-weight:700; }
  .choice-btn.picked{ background:var(--purple-tint); border-color:var(--purple); color:var(--purple); font-weight:700; }
  .choice-btn.dim{ opacity:0.45; }
  .go-deeper-label{ font-size:0.82rem; color:var(--text-soft); font-weight:600; margin:0.9rem 0 0.5rem; }
  .deeper-chip{ font-size:0.85rem; font-weight:600; padding:0.55rem 0.9rem; border-radius:16px; background:var(--surface-2); color:var(--gold); border:1px solid var(--border); cursor:pointer; margin:0 0.5rem 0.5rem 0; }
  .xp-tag{ font-size:0.88rem; color:var(--green); font-weight:700; margin-top:0.4rem; }
  .rarity-tag{ font-size:0.65rem; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; padding:0.15rem 0.5rem; border-radius:10px; margin-left:0.4rem; }
  .rarity-tag.common{ background:var(--surface-2); color:var(--text-soft); }
  .rarity-tag.uncommon{ background:var(--green-tint); color:var(--green); }
  .rarity-tag.rare{ background:var(--blue-tint); color:var(--blue); }
  .rarity-tag.epic{ background:var(--purple-tint); color:var(--purple); }
  .rarity-tag.legendary{ background:var(--gold-tint); color:var(--gold); }
  .boss-card{ border:1px solid var(--gold); box-shadow:0 0 0 1px var(--gold), 0 16px 34px -14px rgba(232,196,104,0.35); }
  .collect-grid{ display:flex; gap:0.5rem; flex-wrap:wrap; }
  .collect-chip{ font-size:0.72rem; font-weight:700; padding:0.4rem 0.7rem; border-radius:14px; border:1px solid var(--border); background:var(--surface); color:var(--text-soft); }
  .collect-chip.got{ border-color:var(--rarity-color); color:var(--rarity-color); background:var(--surface-2); }
  .streak-banner{ font-size:0.82rem; font-weight:600; color:var(--gold); margin-top:0.5rem; }
  .floatxp{ position:absolute; right:0.1rem; top:-0.5rem; font-weight:700; font-size:0.9rem; color:var(--green); pointer-events:none; animation:floatup 1.1s ease forwards; }
  @keyframes floatup{ 0%{ opacity:0; transform:translateY(4px);} 15%{opacity:1;} 100%{ opacity:0; transform:translateY(-28px);} }
  .skeleton-card{ border-radius:18px; background:var(--surface); border:1px solid var(--border); display:flex; flex-direction:column; justify-content:center; padding:1.25rem 1.3rem; margin-bottom:1rem; }
  .skeleton-bar{ height:0.9rem; background:var(--surface-2); border-radius:6px; margin-bottom:0.6rem; max-width:28ch; }
  .empty-full{ min-height:40vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:2rem; }
  .empty-full h3{ font-family:'Poppins',sans-serif; font-weight:600; color:var(--text); margin:0 0 0.5rem; }
  .empty-full p{ color:var(--text-soft); font-size:0.9rem; margin:0 0 1.2rem; }
  .sentinel{ height:1px; }

  /* ---- EXPLORE ---- */
  #view-explore{ padding:1.2rem 1.1rem 2rem; }
  .explore-title{ font-family:'Poppins',sans-serif; font-size:1.3rem; font-weight:700; margin:0.3rem 0 0.4rem; }
  .explore-sub{ color:var(--text-soft); font-size:0.85rem; margin:0 0 1.1rem; }
  .tile-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0.8rem; }
  .tile{
    border-radius:16px; padding:1.1rem; min-height:110px; display:flex; flex-direction:column; justify-content:space-between;
    background: radial-gradient(circle at 75% 15%, var(--tile-glow), transparent 60%), var(--surface);
    border:1px solid var(--border); cursor:pointer; position:relative;
  }
  .tile-selected{ border-color:var(--tile-color); box-shadow:0 0 0 1px var(--tile-color); }
  .tile .tile-check{ position:absolute; top:0.7rem; right:0.8rem; font-size:0.85rem; font-weight:700; color:var(--tile-color); }
  .tile .tile-name{ font-family:'Poppins',sans-serif; font-weight:700; font-size:1rem; color:var(--tile-color); }
  .tile .tile-hint{ font-size:0.76rem; color:var(--text-soft); margin-top:0.3rem; }
  .mission-strip{ display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:1.2rem; }
  .mission-hero{
    background:linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%);
    border:1px solid var(--gold); border-radius:20px; padding:1.4rem 1.5rem; margin-bottom:1.3rem;
    box-shadow:0 14px 34px -18px rgba(232,196,104,0.3);
  }
  .mission-greeting{ font-size:1.25rem; font-weight:700; margin:0; }
  .mission-sub{ font-size:0.85rem; color:var(--text-soft); margin:0.2rem 0 1rem; }
  .mission-list{ display:flex; flex-direction:column; gap:0.5rem; margin-bottom:0.8rem; }
  .mission-row{ display:flex; align-items:center; gap:0.6rem; font-size:0.9rem; color:var(--text-soft); }
  .mission-row.done{ color:var(--text); }
  .mission-check{ width:1.3rem; height:1.3rem; border-radius:50%; border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:0.8rem; flex-shrink:0; }
  .mission-row.done .mission-check{ background:var(--gold); border-color:var(--gold); color:#3A2C00; }
  .mission-count{ margin-left:auto; font-size:0.78rem; color:var(--text-soft); }
  .mission-xp{ font-size:0.85rem; font-weight:700; color:var(--gold); margin:0 0 0.9rem; }
  .mission-due-btn{ display:block; width:100%; background:var(--purple-tint); border:1px solid var(--purple); color:var(--purple); font-weight:700; font-size:0.85rem; padding:0.6rem; border-radius:12px; margin-bottom:0.9rem; cursor:pointer; }
  .mission-quote{ font-size:0.8rem; font-style:italic; color:var(--text-soft); margin:0; border-top:1px solid var(--border); padding-top:0.8rem; }
  .overlay{ position:fixed; inset:0; z-index:90; background:var(--bg); display:flex; flex-direction:column; }
  .overlay.hidden{ display:none; }
  .overlay-header{ display:flex; align-items:center; gap:1rem; padding:1rem 1.1rem; border-bottom:1px solid var(--border); flex-shrink:0; }
  .overlay-back{ background:var(--surface); border:1px solid var(--border); color:var(--text); font-size:0.8rem; font-weight:600; padding:0.4rem 0.75rem; border-radius:12px; cursor:pointer; }
  #overlay-title{ font-family:'Poppins',sans-serif; font-weight:700; font-size:1rem; }
  .overlay-body{ flex:1; overflow-y:auto; padding:1.2rem 1.1rem 2rem; max-width:640px; margin:0 auto; width:100%; box-sizing:border-box; }
  .breadcrumb-row{ display:flex; gap:0.4rem; flex-wrap:wrap; margin-bottom:1rem; }
  .breadcrumb-chip{ font-size:0.72rem; font-weight:600; padding:0.3rem 0.6rem; border-radius:12px; background:var(--surface-2); color:var(--text-soft); }
  .create-menu-row{
    display:flex; align-items:center; gap:0.9rem; padding:0.9rem 1rem; border-radius:14px; background:var(--surface);
    border:1px solid var(--border); margin-bottom:0.7rem; cursor:pointer;
  }
  .create-menu-row.active{ border-color:var(--gold); background:var(--gold-tint); }
  .create-menu-icon{ font-size:1.3rem; }
  .create-menu-title{ font-weight:700; font-size:0.92rem; }
  .create-menu-sub{ font-size:0.76rem; color:var(--text-soft); }
  .upcoming-row{ display:flex; align-items:center; gap:0.7rem; padding:0.65rem 0; border-bottom:1px solid var(--border); }
  .upcoming-icon{ width:2rem; height:2rem; border-radius:10px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; }
  .upcoming-name{ flex:1; font-size:0.88rem; font-weight:600; }
  .upcoming-when{ font-size:0.76rem; color:var(--text-soft); }
  .mastery-bar-outer{ height:6px; background:var(--surface-2); border-radius:4px; overflow:hidden; margin:0.4rem 0 0.6rem; }
  .mastery-bar-inner{ height:100%; background:linear-gradient(90deg, var(--blue), var(--green)); border-radius:4px; }
  .stage-tag{ font-size:0.68rem; font-weight:700; color:var(--text-soft); text-transform:uppercase; letter-spacing:0.03em; }
  .verdict-strong{ color:var(--green); }
  .verdict-partial{ color:var(--orange); }
  .verdict-weak{ color:var(--red); }

  /* ---- CREATE (inside overlay) ---- */
  .create-title{ font-family:'Poppins',sans-serif; font-size:1.3rem; font-weight:700; margin:0.3rem 0 0.4rem; }
  .create-sub{ color:var(--text-soft); font-size:0.88rem; margin:0 0 1.2rem; }
  #create-input{
    width:100%; min-height:70px; font-family:'Inter',sans-serif; font-size:0.98rem; color:var(--text);
    background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:0.8rem 0.9rem; margin-bottom:1rem;
  }
  .create-type-row{ display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:1.2rem; }
  .create-type-chip{ font-size:0.8rem; font-weight:600; padding:0.45rem 0.8rem; border-radius:14px; border:1px solid var(--border); background:var(--surface); color:var(--text-soft); cursor:pointer; }
  .create-type-chip.active{ background:var(--gold); border-color:var(--gold); color:#3A2C00; }

  .lib-card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:1.1rem 1.2rem; margin-bottom:1rem; }
  .lib-card h3{ font-family:'Poppins',sans-serif; font-size:1.05rem; margin:0 0 0.3rem; }
  .lib-card .body-text{ font-size:0.92rem; line-height:1.55; color:#CFCADE; margin:0 0 0.4rem; }

  /* ---- CHALLENGE / MEMORY ---- */
  #view-challenge{ padding:1.2rem 1.1rem 2rem; }
  #view-memory{ padding:1.2rem 1.1rem 2rem; }
  .hub-tile{
    display:flex; align-items:center; gap:1rem; padding:1.1rem 1.2rem; border-radius:16px; background:var(--surface);
    border:1px solid var(--border); margin-bottom:0.8rem; cursor:pointer;
  }
  .hub-tile.locked{ opacity:0.5; cursor:default; }
  .hub-icon{ font-size:1.6rem; }
  .hub-title{ font-weight:700; font-size:0.98rem; }
  .hub-sub{ font-size:0.78rem; color:var(--text-soft); }
  .memory-due-tile{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:0.8rem 1rem; margin-bottom:0.6rem; display:flex; align-items:center; gap:0.7rem; cursor:pointer; }
  .memory-due-dot{ width:0.6rem; height:0.6rem; border-radius:50%; flex-shrink:0; }

  /* ---- PROFILE / YOU (character sheet) ---- */
  #view-profile{ padding:1.4rem 1.1rem 2rem; }
  .char-header{ text-align:center; margin-bottom:1.3rem; }
  .char-avatar{ width:5.5rem; height:5.5rem; border-radius:50%; margin:0 auto 0.7rem; background:radial-gradient(circle at 35% 30%, var(--gold), var(--purple)); display:flex; align-items:center; justify-content:center; font-size:2rem; box-shadow:0 0 0 4px var(--surface-2), 0 0 24px rgba(232,196,104,0.4); }
  .char-level{ font-family:'Poppins',sans-serif; font-size:1.5rem; font-weight:700; }
  .char-title{ color:var(--gold); font-size:0.95rem; font-weight:600; margin:0.15rem 0 0; }
  .char-xp{ color:var(--text-soft); font-size:0.8rem; margin:0.3rem 0 0; }
  .profile-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:1.2rem; }
  .profile-level{ font-family:'Poppins',sans-serif; font-size:1.3rem; font-weight:700; }
  .profile-level .lv-tag{ color:var(--gold); }
  .xp-bar-outer{ height:12px; background:var(--surface-2); border-radius:7px; overflow:hidden; margin:0.5rem 0 1.3rem; border:1px solid var(--border); }
  .xp-bar-inner{ height:100%; background:linear-gradient(90deg, var(--purple), var(--pink), var(--gold)); border-radius:7px; }
  .profile-section{ margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
  .profile-section:last-child{ border-bottom:none; }
  .profile-section h4{ font-family:'Poppins',sans-serif; font-size:0.92rem; font-weight:600; color:var(--text-soft); margin:0 0 0.7rem; text-transform:uppercase; letter-spacing:0.03em; }
  .streak-row{ display:flex; gap:0.4rem; }
  .streak-dot{ flex:1; height:34px; border-radius:8px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:0.72rem; color:var(--text-soft); font-weight:600; }
  .streak-dot.on{ background:var(--gold-tint); color:var(--gold); border:1px solid var(--gold); }
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0.7rem; }
  .stat-box{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:0.9rem 1rem; }
  .stat-box .num{ font-family:'Poppins',sans-serif; font-size:1.35rem; font-weight:700; color:var(--gold); }
  .stat-box .lbl{ font-size:0.76rem; color:var(--text-soft); margin-top:0.15rem; }
  .bar-row{ display:flex; align-items:center; gap:0.7rem; margin-bottom:0.6rem; }
  .bar-row .bar-label{ width:90px; font-size:0.8rem; color:var(--text-soft); flex-shrink:0; }
  .bar-row .bar-track{ flex:1; height:8px; background:var(--surface-2); border-radius:5px; overflow:hidden; }
  .bar-row .bar-fill{ height:100%; background:linear-gradient(90deg, var(--blue), var(--purple)); border-radius:5px; }
  .badge-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:0.6rem; }
  .badge-tile{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:0.6rem 0.4rem; text-align:center; font-size:0.66rem; color:var(--text-soft); font-weight:600; }
  .badge-tile.unlocked{ background:var(--gold-tint); border-color:var(--gold); color:var(--gold); }
  .focus-ladder{ display:flex; gap:0.4rem; flex-wrap:wrap; }
  .focus-pip{ font-size:0.72rem; font-weight:700; padding:0.4rem 0.65rem; border-radius:12px; background:var(--surface); border:1px solid var(--border); color:var(--text-soft); }
  .focus-pip.hit{ background:var(--gold-tint); border-color:var(--gold); color:var(--gold); }
  .map-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0.7rem; }
  .map-node{ border-radius:14px; padding:0.8rem; border:1px solid var(--border); background:var(--surface); opacity:0.55; }
  .map-node.bronze{ opacity:0.85; border-color:var(--node-color); }
  .map-node.silver{ opacity:1; border-color:var(--node-color); box-shadow:0 0 0 1px var(--node-color); }
  .map-node.gold{ opacity:1; border-color:var(--gold); box-shadow:0 0 0 1px var(--gold); background:linear-gradient(135deg, var(--surface), var(--gold-tint)); }
  .map-name{ font-family:'Poppins',sans-serif; font-weight:700; font-size:0.9rem; }
  .map-tier{ font-size:0.72rem; color:var(--text-soft); margin-top:0.2rem; }

  /* ---- NAV ---- */
  nav{
    display:flex; justify-content:space-around; align-items:center; background:var(--surface);

    async get(key, shared){
      try{ const v = localStorage.getItem('fn_'+key); if(v===null) return null; return {key, value:v, shared:!!shared}; }
      catch(e){ return null; }
    },
    async set(key, value, shared){
      try{ localStorage.setItem('fn_'+key, value); return {key, value, shared:!!shared}; }
      catch(e){ return null; }
    },
    async delete(key, shared){
      try{ localStorage.removeItem('fn_'+key); return {key, deleted:true, shared:!!shared}; }
      catch(e){ return null; }
    },
    async list(prefix, shared){
      try{
        const keys = Object.keys(localStorage).filter(k=>k.startsWith('fn_'+(prefix||''))).map(k=>k.slice(3));
        return {keys, prefix, shared:!!shared};
      }catch(e){ return null; }
    }
  };

function localDateStr(d){
  d = d || new Date();

/* ---------------- MEMORY ENGINE ---------------- */
const MEM_INTERVALS = [1,3,7,14,30,60,120];
function stageOf(mastery){
  if(mastery>=100) return 'Perfected';
  if(mastery>=80) return 'Mastered';
  if(mastery>=60) return 'Known';
  if(mastery>=40) return 'Familiar';
  if(mastery>=20) return 'Learning';
  return 'Discovered';
}
function recallLevelOf(mastery){
  if(mastery>=75) return 4;
  if(mastery>=50) return 3;
  if(mastery>=25) return 2;
  return 1;
}
function normKey(term){ return (term||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(); }
function wordSet(str){
  const stop = new Set(['the','a','an','of','in','on','to','and','or','is','are','effect','theory']);
  return new Set((str||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>=3 && !stop.has(w)));
}
function jaccard(a,b){
  if(a.size===0 || b.size===0) return 0;
  let inter=0; a.forEach(w=>{ if(b.has(w)) inter++; });
  const union = a.size + b.size - inter;
  return union===0 ? 0 : inter/union;
}
function findSimilarConcept(term){
  const words = wordSet(term);
  const nt = normKey(term);
  let best=null, bestScore=0;
  Object.entries(state.memoryBank).forEach(([key,item])=>{
    const candidates = [item.term].concat(item.aliases||[]);
    candidates.forEach(c=>{
      const nc = normKey(c);
      let score = jaccard(words, wordSet(c));
      if(nc.includes(nt) || nt.includes(nc)) score = Math.max(score, 0.75);
      if(score>bestScore){ bestScore=score; best={key,item}; }
    });
  });
  return {match:best, score:bestScore};
}
async function checkConceptEquivalence(termA, defA, termB, defB){
  try{
    const system = "Return ONLY raw JSON: {\"same\": boolean}. Decide whether these two labels refer to the same underlying concept (just worded differently), not merely a related idea.";
    const user = 'Concept A: "'+termA+'" ('+defA+'). Concept B: "'+termB+'" ('+defB+').';
    const raw = await callClaude(system, user, 100);
    return JSON.parse(stripFence(raw)).same===true;
  }catch(e){ return false; }
}
async function addToMemoryBank(term, category, definition, rarity, startMastery){
  if(!term || !definition) return;
  const key = normKey(term);
  if(!key || state.memoryBank[key]) return;
  const {match, score} = findSimilarConcept(term);
  if(match && score>=0.65){
    match.item.aliases = match.item.aliases || [];
    if(!match.item.aliases.some(a=>normKey(a)===key)) match.item.aliases.push(term);
    persist('memory-bank', state.memoryBank);
    showToast('\ud83d\udd17 Merged into ' + match.item.term + ' (also known as: ' + term + ')');
    return;
  }
  if(match && score>=0.35){
    const same = await checkConceptEquivalence(term, definition, match.item.term, match.item.definition);
    if(same){
      match.item.aliases = match.item.aliases || [];
      if(!match.item.aliases.some(a=>normKey(a)===key)) match.item.aliases.push(term);
      persist('memory-bank', state.memoryBank);
      showToast('\ud83d\udd17 Merged into ' + match.item.term + ' (also known as: ' + term + ')');
      return;
    }
  }
  if(state.memoryBank[key]) return;
  state.memoryBank[key] = {
    term, category: category||'General', definition, rarity: rarity||'Common', aliases:[],
    mastery: startMastery||15, intervalIndex: 0, nextReview: Date.now() + MEM_INTERVALS[0]*86400000,
    createdAt: Date.now(), timesReviewed: 0, masteredCelebrated:false, perfectedCelebrated:false,
  };
  persist('memory-bank', state.memoryBank);
  checkGeneralGraduation();
  if((rarity||'Common')==='Legendary'){
    showCardUnlockPopup(term, rarity);
  } else {
    showToast('\ud83c\udccf Card Earned: ' + term + ' \u2014 ' + (startMastery||15) + '% mastery (' + (rarity||'Common') + ')');
  }
}
function markLearned(term, category, definition, rarity){
  if(!term || !definition) return;
  const key = normKey(term);
  if(state.memoryBank[key]) return;
  if(state.pendingKnowledge[key]){
    state.pendingKnowledge[key].addedAt = state.interactionCount;
    persist('pending-knowledge', state.pendingKnowledge);
    return;
  }
  state.pendingKnowledge[key] = {
    term, category: category||'General', definition, rarity: rarity||'Common',
    addedAt: state.interactionCount, dueIn: 3+Math.floor(Math.random()*4), attempts:0,

}

function inGeneralBucket(category){
  if(itemMatchesAnyCoreDomain(category)) return false;
  if(state.customCollections.some(c=>c.toLowerCase()===(category||'').toLowerCase())) return false;
  return true;
}
function domainMasteryAvg(domain){
  const items = domain.id==='General'
    ? Object.values(state.memoryBank).filter(m=>inGeneralBucket(m.category))
    : Object.values(state.memoryBank).filter(m=>itemMatchesDomain(m.category, domain));
  if(items.length===0) return {avg:0, count:0};
  return {avg: Math.round(items.reduce((s,i)=>s+i.mastery,0)/items.length), count: items.length};
}
function itemsInDomain(domain){
  return domain.id==='General'
    ? Object.entries(state.memoryBank).filter(([k,m])=>inGeneralBucket(m.category)).map(([k,m])=>({key:k, ...m}))
    : Object.entries(state.memoryBank).filter(([k,m])=>itemMatchesDomain(m.category, domain)).map(([k,m])=>({key:k, ...m}));
}
function itemsInCollection(categoryName){
  return Object.entries(state.memoryBank).filter(([k,m])=>(m.category||'').toLowerCase()===categoryName.toLowerCase()).map(([k,m])=>({key:k, ...m}));

function checkGeneralGraduation(){
  const generalItems = Object.values(state.memoryBank).filter(m=>inGeneralBucket(m.category));
  const counts = {};
  generalItems.forEach(it=>{ counts[it.category] = (counts[it.category]||0)+1; });
  Object.entries(counts).forEach(([cat,count])=>{
    if(count>=8 && !state.customCollections.includes(cat)){
      state.customCollections.push(cat);
      persist('custom-collections', state.customCollections);
      showToast('\ud83c\udf10 ' + count + ' ' + cat + ' concepts discovered \u2014 new collection created!');
    }
  });
}
function findConnectPair(){
  const candidates = [];
  KNOWLEDGE_MAP.forEach(d=>{
    const eligible = itemsInDomain(d).filter(i=>i.mastery>=40);
    if(eligible.length>=2) candidates.push(eligible);
  });
  if(candidates.length===0) return null;
  const pool = candidates[Math.floor(Math.random()*candidates.length)];
  const shuffled = pool.slice().sort(()=>Math.random()-0.5);
  return {itemA: shuffled[0], itemB: shuffled[1]};
}

function applyReviewResult(item, verdict){
  resetMemoryStatsIfNeeded();
  state.memoryStats.reviewed += 1;
  const prevMastery = item.mastery;
  if(verdict==='Strong'){
    item.mastery = Math.min(100, item.mastery + 18);
    item.intervalIndex = Math.min(item.intervalIndex+1, MEM_INTERVALS.length-1);
    state.memoryStats.remembered += 1;
  } else if(verdict==='Partial'){
    item.mastery = Math.min(100, item.mastery + 8);
    state.memoryStats.remembered += 1;
  } else {
    item.mastery = Math.max(0, item.mastery - 10);
    item.intervalIndex = 0;
    state.memoryStats.forgotten += 1;
  }
  item.timesReviewed += 1;
  item.nextReview = Date.now() + MEM_INTERVALS[item.intervalIndex]*86400000;
  if(item.mastery>=100 && !item.perfectedCelebrated){
    item.perfectedCelebrated = true; item.masteredCelebrated = true;
    state.xp += 80; persistProgress();
    showCardUnlockPopup(item.term, 'Perfected', '\ud83c\udfc6 Concept Perfected');
  } else if(item.mastery>=80 && prevMastery<80 && !item.masteredCelebrated){
    item.masteredCelebrated = true;
    state.xp += 50; persistProgress();
    showToast('\ud83e\udde0 Mastery reached! ' + item.term + ' \u2014 ' + item.mastery + '% Mastered  +50 XP');
  }
  persist('memory-bank', state.memoryBank);
  persist('memory-stats', state.memoryStats);
  checkKnowledgeMapMastery();
}

function timeoutRejection(ms){
  return new Promise((_, reject)=>{
    setTimeout(()=>{ const err = new Error('timeout'); err.name = 'TimeoutError'; reject(err); }, ms);
  });
}
async function fetchWithTimeout(url, options, ms){
  return Promise.race([ fetch(url, options), timeoutRejection(ms) ]);
}
async function callClaudeInner(system, userText, maxTokens){
  const body = JSON.stringify({ model:"claude-sonnet-5", max_tokens: maxTokens || 1000, system: system, messages:[{role:"user", content:userText}] });
  let primaryErr = null;
  try{
    const r = await fetchWithTimeout('/.netlify/functions/claude', { method:"POST", headers:{"Content-Type":"application/json"}, body }, 30000);
    const data = await r.json().catch(()=>null);
    if(r.ok && data){
      return (data.content||[]).map(b=>b.text||"").join("\n");
    }
    primaryErr = (data && data.error && (data.error.message || JSON.stringify(data.error))) || ('HTTP '+r.status);
  }catch(e){ primaryErr = e.name==='TimeoutError' ? 'Request timed out after 30s (function may be cold-starting or under heavy load)' : e.message; }
  try{
    const response = await fetchWithTimeout("https://api.anthropic.com/v1/messages", { method:"POST", headers:{"Content-Type":"application/json"}, body }, 8000);
    const data2 = await response.json().catch(()=>null);
    if(response.ok && data2){
      return (data2.content||[]).map(b=>b.text||"").join("\n");
    }
    const secondaryErr = (data2 && data2.error && (data2.error.message || JSON.stringify(data2.error))) || ('HTTP '+response.status);
    throw new Error((primaryErr||'')+' | '+secondaryErr);
  }catch(e2){
    throw new Error(primaryErr || e2.message || 'Unknown error contacting Claude');
  }
}
let networkQueue = Promise.resolve();
function callClaude(system, userText, maxTokens){
  const task = () => callClaudeInner(system, userText, maxTokens);
  const run = networkQueue.then(task, task);
  networkQueue = run.then(()=>{}, ()=>{});
  return run;
}
function stripFence(text){ return text.replace(/```json/gi,"").replace(/```/g,"").trim(); }
function extractJsonArray(text){
  const start = text.indexOf('['); const end = text.lastIndexOf(']');
  if(start===-1 || end===-1 || end<start) throw new Error('No JSON array found');
  return text.slice(start, end+1);
}
function extractCompleteObjects(text){
  const start = text.indexOf('[');
  if(start===-1) throw new Error('No JSON array found in response');
  let depth = 0, inStr = false, esc = false, objStart = -1;
  const chunks = [];
  for(let i=start+1;i<text.length;i++){
    const ch = text[i];
    if(inStr){
      if(esc){ esc=false; } else if(ch==='\\'){ esc=true; } else if(ch==='"'){ inStr=false; }
      continue;
    }
    if(ch==='"'){ inStr=true; continue; }
    if(ch==='{'){ if(depth===0) objStart=i; depth++; }
    else if(ch==='}'){ depth--; if(depth===0 && objStart!==-1){ chunks.push(text.slice(objStart, i+1)); objStart=-1; } }
    else if(ch===']' && depth===0){ break; }
  }
  const parsedObjs = [];
  chunks.forEach(c=>{ try{ parsedObjs.push(JSON.parse(c)); }catch(e){} });
  if(parsedObjs.length===0) throw new Error('Response was cut off before any complete card finished \u2014 try again');
  return parsedObjs;
}

const FOCUS_MILESTONES = [30,60,120,180,300,600];
function formatFocus(sec){
  if(sec<60) return sec+'s';
  const m = Math.floor(sec/60), s = sec%60;
  return m+'m'+(s?' '+s+'s':'');
}
function trackFocus(){
  const now = Date.now();
  if(!state.focusSession.startedAt || (now - state.focusSession.lastActionAt) > 90000){
    state.focusSession.startedAt = now;
  }
  state.focusSession.lastActionAt = now;
  const lengthSec = Math.round((now - state.focusSession.startedAt)/1000);
  if(lengthSec > state.focusBestSec){
    const crossed = FOCUS_MILESTONES.find(m=> state.focusBestSec<m && lengthSec>=m);
    state.focusBestSec = lengthSec;
    persist('focus-best', state.focusBestSec);
    if(crossed) showToast('\ud83d\udd25 New focus milestone \u2014 ' + formatFocus(crossed) + ' straight');
  }
}

function awardXP(amount, anchorEl){
  trackFocus();
  const prevLevel = levelOf(state.xp);
  state.xp += amount;
  const newLevel = levelOf(state.xp);
  if(anchorEl){
    const f = document.createElement('span'); f.className='floatxp'; f.textContent = '+'+amount+' XP';
    anchorEl.style.position = anchorEl.style.position || 'relative';
    anchorEl.appendChild(f); setTimeout(()=>f.remove(), 1150);
  }
  if(newLevel>prevLevel){
    const rect = anchorEl ? anchorEl.getBoundingClientRect() : {left:window.innerWidth/2, top:220};
    burstConfetti(rect.left+20, rect.top);
    const banner = document.createElement('div'); banner.className='levelup-banner';
    banner.innerHTML = '<div class="big display">Level '+newLevel+'</div><div class="small">'+state.xp+' XP total</div>';
    document.body.appendChild(banner); setTimeout(()=>banner.remove(), 2700);
  }
  checkBadges();
  persistProgress();
  if(state.view==='profile') renderProfile();
}
function checkStreak(){
  const today = localDateStr();
  if(state.streak.lastDate === today) return;
  const yesterday = localDateStr(new Date(Date.now()-86400000));
  state.streak.count = (state.streak.lastDate === yesterday) ? state.streak.count+1 : 1;
  state.streak.lastDate = today;
  persist('streak', state.streak);
  awardXP(10 + Math.floor(Math.random()*10));
}

const SHARED_SYSTEM_INTRO = "You generate short educational content cards for a personal learning feed designed to feel as engaging as short-form video, but built entirely on genuine, verifiable content \u2014 never fabricated statistics, fake social-proof numbers, or invented claims about what other people think or got wrong. Every fact must be real and something you actually know to be true. Return ONLY a raw JSON array, no markdown fences, no commentary \u2014 just the array. Each element must match exactly one of these shapes based on its \"type\" field:\n\n";
const RATING_NOTE = " Every card of this type must also include: \"difficulty\":1-5 (how hard the underlying concept is to grasp), \"importance\":1-5 (how fundamental/useful this is to know in general \u2014 5 means everyone should know this), \"depth\":1-5 (how much nuance/complexity lies beneath the surface). Rate honestly and vary these across a batch \u2014 not everything is a 5. A simple, widely-important fact should score LOW difficulty/depth and HIGH importance. A niche, complex, narrow topic should score HIGH difficulty/depth and LOWER importance.";
const CARD_SHAPES = "French card: {\"type\":\"french\",\"exercise\":\"exactly one of: vocab, translate_to_en, translate_to_fr, phrase\",\"word\":\"the target French word or phrase (for vocab/phrase exercises)\",\"phonetic\":\"pronunciation guide (omit for translate exercises)\",\"partOfSpeech\":\"(omit for phrase/translate exercises)\",\"meaning\":\"English meaning/translation\",\"sourceText\":\"for translate_to_en: a French sentence to translate. For translate_to_fr: an English sentence to translate. Omit for vocab/phrase.\",\"example\":\"an example sentence in French (omit for translate exercises, since sourceText covers that role)\",\"exampleTranslation\":\"English translation of example (omit for translate exercises)\",\"prompt\":\"a short instruction in English matching the exercise: for vocab, ask them to write their own sentence using the word; for phrase, ask when/how they'd use it or to use it in a sentence; for translate_to_en, ask 'What does this say in English?'; for translate_to_fr, ask 'How do you say this in French?'\",\"difficulty\":\"beginner, intermediate, or advanced\"}. Vary the exercise type across a batch \u2014 don't repeat the same one twice in a row. 'phrase' should be a genuinely common, useful real-life phrase (greetings, ordering food, asking directions, etc.), not just a vocabulary word.\n\nKnowledge card: {\"type\":\"knowledge\",\"hook\":\"a punchy, curiosity-driving opening line or question (not a dry title)\",\"category\":\"one or two words, e.g. Psychology, History, Book wisdom, Physics\",\"predictPrompt\":\"a short line asking the learner to guess or predict something specific related to the hook, BEFORE telling them the answer\",\"predictChoices\":[\"2 or 3 short guess options\"],\"predictCorrectIndex\":0,\"body\":\"1-2 short, punchy sentences revealing the real answer/fact \u2014 the single most interesting thing, not a full explanation\",\"takeaway\":\"one memorable one-line summary, distinct wording from body\",\"goDeeper\":[\"exactly 3 short related sub-topic labels (2-4 words each)\"]}."+RATING_NOTE+" If there genuinely isn't a single correct prediction (a judgment call, not a fact), set predictCorrectIndex to -1. Every knowledge card MUST have a prediction step \u2014 never skip predictChoices. Blend interesting concepts/effects/phenomena with life lessons and wisdom from books and thinkers.\n\nTrivia card: {\"type\":\"trivia\",\"category\":\"one or two words, e.g. History, Geography, Inventions, How things work, World cultures, Science\",\"hook\":\"the question phrased in an intriguing, punchy way \u2014 use a direct 'versus' or comparison framing when it fits naturally (e.g. 'which came first', 'which is bigger') \u2014 still a genuine answerable trivia question\",\"choices\":[\"exactly 4 short answer options\"],\"correctIndex\":0,\"explanation\":\"exactly 1 short sentence revealing the answer with a genuine extra detail\"}."+RATING_NOTE+" Cover real, verifiable facts \u2014 history, countries and cultures, how things were built or invented, how everyday systems work.\n\nChallenge card: {\"type\":\"challenge\",\"category\":\"one or two words, e.g. Money, Careers, Ethics, Strategy\",\"hook\":\"a real-world decision scenario framed as an intriguing question, ideally putting the learner directly in a role ('you're the...')\",\"choices\":[\"exactly 3 short option labels\"],\"consequences\":[\"exactly 3 entries, matching order, each just 1 short punchy sentence on what genuinely tends to happen with that choice\"],\"insight\":\"one closing sentence \u2014 either what tends to work best and why, or an honest note that there's no single right answer\"}."+RATING_NOTE+"\n\nMystery card: {\"type\":\"mystery\",\"category\":\"one or two words\",\"hook\":\"an intriguing mystery setup, 1 sentence, e.g. a strange or unexplained real situation\",\"clues\":[\"exactly 3 short clues, each 1 short sentence, revealed one at a time, building toward the answer\"],\"question\":\"what's your diagnosis/verdict, phrased as a question\",\"choices\":[\"exactly 3 short answer options\"],\"correctIndex\":0,\"reveal\":\"1-2 sentences revealing the real explanation/twist\"}."+RATING_NOTE+" Base this on a genuine real phenomenon, historical event, or true story \u2014 never fabricate a fake case.\n\nDebate card: {\"type\":\"debate\",\"category\":\"one or two words\",\"hook\":\"a genuinely two-sided, debatable question (not a settled fact)\",\"sideA\":\"short label for position A (2-4 words)\",\"sideB\":\"short label for position B (2-4 words)\",\"argumentA\":\"1-2 sentences, the strongest genuine case for side A\",\"argumentB\":\"1-2 sentences, the strongest genuine case for side B\",\"closing\":\"one balanced closing sentence \u2014 never declare a winner, since this is genuinely contested\"}. Pick topics that are legitimately debatable (not settled science, not extreme or offensive positions) \u2014 things reasonable people disagree on.\n\nVersus card: {\"type\":\"versus\",\"category\":\"one or two words\",\"hook\":\"a short framing line introducing the comparison\",\"optionA\":\"short label for option A\",\"optionB\":\"short label for option B\",\"correctOption\":\"A or B \u2014 whichever is genuinely correct/better by real evidence\",\"explanation\":\"1-2 sentences revealing why, with a real fact or number\"}."+RATING_NOTE+" Use this for things with a genuine factual answer (which is bigger/older/richer/faster), not opinions.\n\nCreate card: {\"type\":\"create\",\"category\":\"exactly one of: Writing, Design, Music, Storytelling, Photography, Creativity, Building ideas, Innovation\",\"hook\":\"a punchy framing line for a hands-on creative task\",\"concept\":\"if a specific prior-learned concept is supplied below, name it here, otherwise omit\",\"task\":\"the actual creative instructions \u2014 something the learner writes/sketches-in-words/composes as a short free response, ideally applying an idea from another field into this creative one (e.g. 'Design a book cover concept that visually represents confirmation bias')\",\"rubric\":\"1-2 sentences on what a strong response would include, used to grade it\"}."+RATING_NOTE+" This is about turning understanding into creation \u2014 make the task concrete and doable in a few sentences, not vague.\n\nBoss battle card: {\"type\":\"boss\",\"category\":\"the domain being tested\",\"hook\":\"an intense scenario that requires combining several things the learner would already know about this domain to solve\",\"choices\":[\"exactly 4 options, each plausible, requiring real synthesis to pick correctly\"],\"correctIndex\":0,\"explanation\":\"2-3 sentences on why that's right and what it draws together\"}. Make this noticeably harder than a normal trivia question.\n\nKeep everything skimmable. No filler, no throat-clearing, no restating the question. Every sentence must earn its place. Make all content genuinely interesting and non-generic, varying fields and sources across cards.";

function isAllSelected(){ return state.selectedCategories.length===0 || state.selectedCategories.includes('all'); }
function tileLabel(id){ const t = EXPLORE_TILES.find(x=>x.id===id); return t ? t.label : id; }
function typeInstruction(){
  if(isAllSelected()) return "an unpredictable mix of french, knowledge, trivia, challenge, mystery, debate, versus, and create cards, weighted so the answer-first formats (trivia, challenge, mystery, debate, versus) together make up roughly 60% of it, create cards make up roughly 10%, over passive-reading knowledge cards. Vary the order and format so it never feels like the same format twice in a row";
  const includesFrench = state.selectedCategories.includes('french');
  const domains = state.selectedCategories.filter(c=>c.startsWith('domain:')).map(c=>c.slice(7));
  const domainDetail = domains.map(d=> d+' (covering: '+(DOMAIN_TOPIC_LIST[d]||d)+')').join('; ');
  const isCreateOnly = domains.length===1 && domains[0]==='Create';
  const cardTypesForDomain = isCreateOnly ? 'create' : 'knowledge, trivia, challenge, mystery, debate, versus, and create';
  if(includesFrench && domains.length===0) return 'french';
  if(!includesFrench && domains.length>0) return "a mix of "+cardTypesForDomain+" cards, all thematically within these domains: "+domainDetail;
  return "a mix of french cards interleaved with "+cardTypesForDomain+" cards thematically within these domains: "+domainDetail;
}

async function fetchBatch(count){
  const recentTitles = state.seenTitles.slice(-40).join('; ');
  const system = SHARED_SYSTEM_INTRO + CARD_SHAPES + "\n\nFor French cards, follow this CEFR calibration exactly: "+DIFF_PROMPT[state.frenchLevel]+" Always set \"difficulty\" to \""+state.frenchLevel+"\".";
  const implicitPrefs = topAffinities(3);
  const prefHint = implicitPrefs.length ? " The learner has shown particular interest in: "+implicitPrefs.join(', ')+". Lean roughly 2 of every 3 non-French cards toward those, but keep at least 1 in 3 in a different category for variety and surprise." : "";
  const user = "Generate "+count+" cards of type: "+typeInstruction()+"."+prefHint+difficultyHint()+" Never repeat any of these already-used words or titles: "+(recentTitles||'none yet')+".";
  const raw = await callClaude(system, user, 700 + count*900);
  let parsed;
  try{ parsed = JSON.parse(stripFence(raw)); } catch(e){ parsed = extractCompleteObjects(stripFence(raw)); }
  return parsed.map(c=>{
    c.id = uid();
    if(c.type!=='french' && c.type!=='debate' && c.type!=='boss') c.rarity = computeRarity(c.difficulty, c.importance, c.depth);
    return c;
  });
}
async function fetchTargeted(type, topicHint, fromHook){
  const system = SHARED_SYSTEM_INTRO + CARD_SHAPES;
  const user = "Generate exactly 1 card of type: "+type+". It should be about or dive deeper into: \""+topicHint+"\""+(fromHook?(" following on from this earlier idea: \""+fromHook+"\""):"")+". Never repeat any of these already-used words or titles: "+(state.seenTitles.slice(-40).join('; ')||'none yet')+".";
  const raw = await callClaude(system, user, 1600);
  let parsed;
  try{ parsed = JSON.parse(stripFence(raw)); } catch(e){ parsed = extractCompleteObjects(stripFence(raw)); }
  const card = parsed[0]; card.id = uid();
  if(card.type!=='french' && card.type!=='debate' && card.type!=='boss') card.rarity = computeRarity(card.difficulty, card.importance, card.depth);
  return card;
}

async function loadMore(count, includeExtras){
  if(state.loading) return;
  count = count || 2;
  includeExtras = includeExtras===undefined ? true : includeExtras;
  state.loading = true;
  renderHome();
  renderHomeSkeleton(true);
  try{
    const cards = await fetchBatch(count);
    state.feed = state.feed.concat(cards);
    cards.forEach(c=>{ const label = c.word || c.hook; if(label) state.seenTitles.push(label); });
    state.seenTitles = state.seenTitles.slice(-300);
    persist('feed', state.feed.slice(-80));
    persist('seen-titles', state.seenTitles);
    state.error = null;
  }catch(e){ state.error = (e && e.message) ? e.message : 'Could not load new cards.'; }
  state.loading = false;
  renderHome();
  if(includeExtras && !state.error) fetchBonusCardsSequential(2);
}

async function fetchOneBonusCard(){
  try{
    const due = dueReviews(2).filter(item => !state.feed.some(c=>c.type==='review' && c.memKey===normKey(item.term)));
    const alreadyHasConnect = state.feed.some(c=>c.type==='connect');
    const pair = alreadyHasConnect ? null : findConnectPair();
    const bankValues = Object.values(state.memoryBank);
    const alreadyHasSynthesis = state.feed.some(c=>c.type==='create' && c.concept);
    const alreadyHasApplication = state.feed.some(c=>c.appliesConceptKey);
    const applyCandidates = bankValues.filter(m=>m.mastery<100);
    const alreadyHasPendingRecall = state.feed.some(c=>c.type==='pendingRecall');
    const eligiblePending = Object.entries(state.pendingKnowledge).filter(([k,item])=> (state.interactionCount - item.addedAt) >= item.dueIn);

    const options = [];
    if(due.length) options.push('review');
    if(pair) options.push('connect');
    if(!alreadyHasSynthesis && bankValues.length>0) options.push('synthesis');
    if(!alreadyHasApplication && applyCandidates.length>0) options.push('application');
    if(!alreadyHasPendingRecall && eligiblePending.length>0) options.push('pendingRecall');
    if(options.length===0) return false;
    const chosen = options[Math.floor(Math.random()*options.length)];

    let card = null;
    if(chosen==='review'){
      const item = due[0];
      const promptData = await fetchReviewPrompt(item);
      card = { id: uid(), type:'review', memKey: normKey(item.term), term:item.term, category:item.category, mastery:item.mastery, rarity:item.rarity, promptData };
    } else if(chosen==='connect'){
      const promptData = await fetchConnectPrompt(pair.itemA, pair.itemB);
      card = { id: uid(), type:'connect', keyA: pair.itemA.key, keyB: pair.itemB.key, termA: pair.itemA.term, termB: pair.itemB.term, category: pair.itemA.category, promptData };
    } else if(chosen==='synthesis'){
      const item = bankValues[Math.floor(Math.random()*bankValues.length)];
      card = await fetchTargeted('create', 'a Writing, Design, Music, Storytelling, Photography, or Innovation task that applies this specific concept the learner already knows: "'+item.term+'" ('+item.definition+')', '');
    } else if(chosen==='application'){
      const item = applyCandidates[Math.floor(Math.random()*applyCandidates.length)];
      const applyType = ['trivia','mystery','versus'][Math.floor(Math.random()*3)];
      card = await fetchTargeted(applyType, 'a question that requires the learner to APPLY or IDENTIFY this concept in a new, different situation \u2014 not just define it: "'+item.term+'" ('+item.definition+')', '');
      card.appliesConceptKey = normKey(item.term);
      card.appliesConceptTerm = item.term;
    } else if(chosen==='pendingRecall'){
      const [key,item] = eligiblePending[0];
      const promptData = await fetchPendingRecallPrompt(item);
      card = { id: uid(), type:'pendingRecall', pendingKey: key, term: item.term, category: item.category, definition: item.definition, rarity: item.rarity, promptData };
    }
    if(card){
      state.feed.push(card);
      persist('feed', state.feed.slice(-80));
      if(state.view==='home' && !state.overlayView && !state.loading) renderHome();
      return true;
    }
    return false;
  }catch(e){ return false; }
}
async function fetchBonusCardsSequential(maxCount){
  for(let i=0;i<(maxCount||2);i++){
    const gotOne = await fetchOneBonusCard();
    if(!gotOne) break;
  }
}

function renderHome(){
  const el = document.getElementById('view-home');
  el.innerHTML = '';
  const topbar = document.createElement('div'); topbar.className='home-topbar';
  const label = document.createElement('div'); label.className='home-label';
  label.textContent = isAllSelected() ? 'For Your Brain' : state.selectedCategories.map(tileLabel).join(' \u00b7 ');
  topbar.appendChild(label);
  if(isAllSelected() || state.selectedCategories.includes('french')){
    const row = document.createElement('div'); row.className='home-substream';
    ['beginner','intermediate','advanced'].forEach(d=>{
      const b = document.createElement('button'); b.className='diff-btn'+(state.frenchLevel===d?' active':''); b.textContent = DIFF_LABELS[d];
      b.onclick = ()=>{ if(state.frenchLevel===d) return; state.frenchLevel=d; persist('french-level', d); showToast('Loading '+DIFF_LABELS[d]+' cards\u2026'); loadMore(); };
      row.appendChild(b);
    });
    topbar.appendChild(row);
  }
  el.appendChild(topbar);
  el.appendChild(renderMissionHero());

  if(state.feed.length===0){
    const empty = document.createElement('div'); empty.className='empty-full';
    if(state.loading){
      empty.innerHTML = '<h3>Loading your first cards\u2026</h3><p>This can take 20\u201330 seconds \u2014 hang tight, this screen will update when it\u2019s done.</p>';
      el.appendChild(empty);
      return;
    }
    if(state.error){
      empty.innerHTML = '<h3 style="color:var(--red)">Could not load cards</h3><p style="color:var(--red)">'+state.error+'</p>';
      const btn = document.createElement('button'); btn.className='primary'; btn.textContent='Try again';
      btn.onclick = ()=>{ state.error=null; loadMore(); };
      empty.appendChild(btn);
      el.appendChild(empty);
      return;
    }
    empty.innerHTML = '<h3>Nothing loaded yet</h3><p>Tap below to bring in your first cards.</p>';
    const btn = document.createElement('button'); btn.className='primary'; btn.textContent='Load cards';
    btn.onclick = loadMore;
    empty.appendChild(btn);
    el.appendChild(empty);
    return;
  }

  state.feed.forEach(card=>el.appendChild(buildSnapCard(card)));
  const sentinel = document.createElement('div'); sentinel.className='sentinel'; sentinel.id='sentinel';
  el.appendChild(sentinel);
  if(state.error){
    const errWrap = document.createElement('div'); errWrap.className='empty-full'; errWrap.style.minHeight='100vh'; errWrap.style.scrollSnapAlign='start'; errWrap.style.scrollSnapStop='always';
    errWrap.innerHTML = '<h3 style="color:var(--red)">Could not load more</h3><p style="color:var(--red)">'+state.error+'</p>';
    const btn = document.createElement('button'); btn.className='primary'; btn.textContent='Try again'; btn.onclick = loadMore;
    errWrap.appendChild(btn);
    el.appendChild(errWrap);
  }
  setupObserver();
}

function typeColors(card){ return TYPE_COLORS[card.type] || TYPE_COLORS.knowledge; }

function buildSnapCard(card){
  const colors = typeColors(card);
  const wrap = document.createElement('div'); wrap.className='snap-card'+(card.type==='boss'?' boss-card':''); wrap.dataset.id = card.id;
  wrap.style.setProperty('--tag-glow', colors.glow); wrap.style.setProperty('--tag-color', colors.color);

  const tag = document.createElement('div'); tag.className='snap-tag';
  const meta = TYPE_META[card.type] || TYPE_META.knowledge;
  tag.innerHTML = '<span>'+meta.icon+' '+meta.name+'</span>' + (card.category ? '<span class="cat">'+card.category+'</span>' : '') + (card.type==='french' && card.difficulty ? '<span class="cat">'+(DIFF_LABELS[card.difficulty]||card.difficulty)+'</span>' : '') + (card.rarity ? '<span class="rarity-tag '+card.rarity.toLowerCase()+'">'+card.rarity+'</span>' : '');
  wrap.appendChild(tag);

  if(['knowledge','trivia','challenge','mystery','versus','create'].includes(card.type) && card.difficulty && typeof card.difficulty==='number'){
    const stats = document.createElement('div'); stats.className='stat-stars';
    stats.innerHTML = starLine('Difficulty', card.difficulty) + starLine('Importance', card.importance) + starLine('Depth', card.depth);
    wrap.appendChild(stats);
  }

  if(card.type==='french') buildFrenchBody(card, wrap);
  else if(card.type==='trivia') wrap.appendChild(buildTrivia(card));
  else if(card.type==='challenge') wrap.appendChild(buildChallenge(card));
  else if(card.type==='mystery') wrap.appendChild(buildMystery(card));
  else if(card.type==='debate') wrap.appendChild(buildDebate(card));
  else if(card.type==='versus') wrap.appendChild(buildVersus(card));
  else if(card.type==='boss') wrap.appendChild(buildBoss(card));
  else if(card.type==='review') wrap.appendChild(buildReviewCard(card));
  else if(card.type==='pendingRecall') wrap.appendChild(buildPendingRecall(card));
  else if(card.type==='connect') wrap.appendChild(buildConnect(card));
  else if(card.type==='create') wrap.appendChild(buildCreateChallenge(card));
  else buildKnowledgeBody(card, wrap);

  const actions = document.createElement('div'); actions.className='action-col';
  const saveBtn = document.createElement('button'); saveBtn.className='action-btn';
  const already = state.saved.some(c=>c.id===card.id);
  if(already){ saveBtn.classList.add('saved'); saveBtn.innerHTML='&#9829;'; } else { saveBtn.innerHTML='&#9825;'; }
  saveBtn.onclick = ()=>toggleSave(card, saveBtn);
  actions.appendChild(saveBtn);
  wrap.appendChild(actions);
  return wrap;
}

function toggleSave(card, btn){
  const idx = state.saved.findIndex(c=>c.id===card.id);
  if(idx>=0){ state.saved.splice(idx,1); btn.classList.remove('saved'); btn.innerHTML='&#9825;'; }
  else{
    state.saved.push(card); btn.classList.add('saved'); btn.innerHTML='&#9829;';
    awardXP(2+Math.floor(Math.random()*4), btn);
    bumpAffinity(card.category, 3);
    checkBadges();
  }
  persist('saved-cards', state.saved);
}

function buildFrenchBody(card, wrap){
  const ex = card.exercise || 'vocab';
  const isTranslate = ex==='translate_to_en' || ex==='translate_to_fr';
  const headline = isTranslate ? (ex==='translate_to_en' ? card.sourceText : card.sourceText) : card.word;
  const h = document.createElement('h2'); h.textContent = headline; wrap.appendChild(h);

  if(!isTranslate){
    const sub = document.createElement('p'); sub.className='sub';
    sub.textContent = (card.phonetic?card.phonetic+' \u2014 ':'') + (card.partOfSpeech||'');
    wrap.appendChild(sub);
    const meaning = document.createElement('p'); meaning.className='body-text'; meaning.textContent = card.meaning; wrap.appendChild(meaning);
    if(card.example){
      const exDiv = document.createElement('div'); exDiv.className='example'; exDiv.innerHTML = card.example + '<br>' + card.exampleTranslation;
      wrap.appendChild(exDiv);
    }
  } else {
    const tagLine = document.createElement('p'); tagLine.className='sub';
    tagLine.textContent = ex==='translate_to_en' ? 'French \u2192 English' : 'English \u2192 French';
    wrap.appendChild(tagLine);
  }

  const prompt = document.createElement('p'); prompt.className='prompt-line'; prompt.textContent = card.prompt; wrap.appendChild(prompt);

  if(card.journalResponse){
    const ta = document.createElement('textarea'); ta.value = card.journalResponse; ta.disabled = true; wrap.appendChild(ta);
    if(card.feedback){
      const fb = document.createElement('div'); fb.className='feedback';
      fb.innerHTML = '<div class="corrected">'+card.feedback.corrected+'</div>'+card.feedback.feedback;
      wrap.appendChild(fb);
    }
  } else {
    const ta = document.createElement('textarea');
    ta.placeholder = ex==='translate_to_en' ? 'Type the English translation\u2026' : ex==='translate_to_fr' ? 'Type the French translation\u2026' : 'Write your sentence in French...';
    wrap.appendChild(ta);
    const checkBtn = document.createElement('button'); checkBtn.className='primary'; checkBtn.textContent='Check it';
    checkBtn.onclick = async ()=>{
      const val = ta.value.trim();
      if(!val) return;
      checkBtn.disabled = true; checkBtn.textContent='Checking\u2026';
      try{
        let system, user;
        if(ex==='translate_to_en'){
          system = "You are a warm, encouraging French tutor for a learner at CEFR level "+(DIFF_LABELS[card.difficulty]||card.difficulty)+". Return ONLY raw JSON: {\"isCorrect\": boolean, \"corrected\": \"the correct English translation\", \"feedback\": \"2-3 encouraging sentences in English on their translation attempt\"}";
          user = 'French text: "'+card.sourceText+'" (actual meaning: '+card.meaning+'). Learner\'s English translation: "'+val+'"';
        } else if(ex==='translate_to_fr'){
          system = "You are a warm, encouraging French tutor for a learner at CEFR level "+(DIFF_LABELS[card.difficulty]||card.difficulty)+". Return ONLY raw JSON: {\"isCorrect\": boolean, \"corrected\": \"the correct French translation\", \"feedback\": \"2-3 encouraging sentences in English on their translation attempt\"}";
          user = 'English text: "'+card.sourceText+'" (target meaning). Learner\'s French translation: "'+val+'"';
        } else {
          system = "You are a warm, encouraging French tutor for a learner at CEFR level "+(DIFF_LABELS[card.difficulty]||card.difficulty)+". Return ONLY raw JSON: {\"isCorrect\": boolean, \"corrected\": \"corrected sentence or same if correct\", \"feedback\": \"2-3 encouraging sentences in English\"}";
          user = 'Prompt: "'+card.prompt+'" featuring "'+card.word+'" ('+card.meaning+'). Response: "'+val+'"';
        }
        const raw = await callClaude(system, user, 700);
        const parsed = JSON.parse(stripFence(raw));
        card.journalResponse = val; card.feedback = parsed;
        persistFeedUpdate(card);
        state.frenchChecks += 1;
        bumpDaily('french');
        recordAnswer(parsed.isCorrect);
        trackFrenchLevelProgress(parsed.isCorrect);
        if(parsed.isCorrect){
          const term = isTranslate ? card.sourceText : card.word;
          markLearned(term, 'French', card.meaning, null);
        }
        const amount = (parsed.isCorrect?18:10) + Math.floor(Math.random()*8);
        refreshCardInPlace(card, 'mutate', buildFrenchBody);
        requestAnimationFrame(()=>{
          const el = [...document.querySelectorAll('.snap-card')].find(e=>e.dataset.id===card.id);
          const anchor = el ? el.querySelector('.feedback') : null;
          awardXP(amount, anchor);
          if(parsed.isCorrect && anchor){ const r = anchor.getBoundingClientRect(); burstConfetti(r.left+30, r.top); }
        });
      }catch(e){ checkBtn.disabled=false; checkBtn.textContent='Check it'; showToast('Could not check, try again'); }
    };
    wrap.appendChild(checkBtn);
  }
}

function buildKnowledgeBody(card, wrap){
  const h = document.createElement('h2'); h.textContent = card.hook || card.title || card.term; wrap.appendChild(h);
  const bodyText = card.body || card.explanation;
  const hasPredict = Array.isArray(card.predictChoices) && card.predictChoices.length>0;

  if(hasPredict && !card.predicted){
    const pp = document.createElement('p'); pp.className='prompt-line'; pp.textContent = card.predictPrompt || 'What do you think?';
    wrap.appendChild(pp);
    const choiceWrap = document.createElement('div');
    card.predictChoices.forEach((choice,i)=>{
      const b = document.createElement('button'); b.className='choice-btn'; b.textContent = choice;
      b.onclick = ()=>{
        card.predicted = true; card.predictedIndex = i;
        persistFeedUpdate(card);
        bumpDaily('reveals');
        const gotIt = card.predictCorrectIndex>=0 && i===card.predictCorrectIndex;
        if(gotIt){ markLearned(card.hook, card.category, card.takeaway || card.body, card.rarity); }
        if(card.predictCorrectIndex>=0) recordAnswer(gotIt); else bumpInteraction();
        refreshCardInPlace(card, 'mutate', buildKnowledgeBody);
        requestAnimationFrame(()=>{
          const el = [...document.querySelectorAll('.snap-card')].find(e=>e.dataset.id===card.id);
          const anchor = el ? el.querySelector('.body-text') : null;
          awardXP((gotIt?7:3)+Math.floor(Math.random()*4), anchor);
          if(gotIt && anchor){ showToast('Nice, you called it!'); const r = anchor.getBoundingClientRect(); burstConfetti(r.left+30, r.top); }
        });
      };
      choiceWrap.appendChild(b);
    });
    wrap.appendChild(choiceWrap);
    return;
  }

  if(!hasPredict && !card.revealed){
    const revBtn = document.createElement('button'); revBtn.className='reveal-btn'; revBtn.textContent='Reveal';
    revBtn.onclick = ()=>{
      card.revealed = true; persistFeedUpdate(card);
      bumpDaily('reveals');
      refreshCardInPlace(card, 'mutate', buildKnowledgeBody);
      requestAnimationFrame(()=>{
        const el = [...document.querySelectorAll('.snap-card')].find(e=>e.dataset.id===card.id);
        awardXP(2+Math.floor(Math.random()*4), el ? el.querySelector('h2') : null);
      });
    };
    wrap.appendChild(revBtn);
    return;
  }

  if(hasPredict && card.predictCorrectIndex>=0){
    const gotIt = card.predictedIndex===card.predictCorrectIndex;
    const verdict = document.createElement('p'); verdict.className='xp-tag'; verdict.style.color = gotIt ? 'var(--green)' : 'var(--text-soft)';
    verdict.textContent = gotIt ? 'You called it \u2014 ' : 'You guessed "'+card.predictChoices[card.predictedIndex]+'" \u2014 actually:';
    wrap.appendChild(verdict);
  }
  const p = document.createElement('p'); p.className='body-text'; p.textContent = bodyText; wrap.appendChild(p);
  if(card.takeaway){ const tk = document.createElement('div'); tk.className='takeaway'; tk.textContent = card.takeaway; wrap.appendChild(tk); }
  if(card.expanded || card.elaboration || card.recalled){
    appendKnowledgeExtras(card, wrap);
  } else {
    const moreBtn = document.createElement('button'); moreBtn.className='quiz-btn'; moreBtn.style.opacity='0.75'; moreBtn.textContent = '+ More';
    moreBtn.onclick = ()=>{ card.expanded = true; refreshCardInPlace(card, 'mutate', buildKnowledgeBody); };
    wrap.appendChild(moreBtn);
  }
}

function appendKnowledgeExtras(card, wrap){
  wrap.appendChild(buildElaboration(card));
  const memNote = document.createElement('p'); memNote.style.fontSize='0.76rem'; memNote.style.color='var(--text-soft)'; memNote.style.margin='0.5rem 0 0';
  memNote.textContent = '\ud83e\udde0 Added to your memory bank \u2014 it\u2019ll come back for review.';
  wrap.appendChild(memNote);

    const label = document.createElement('p'); label.className='go-deeper-label'; label.textContent = 'Go deeper:'; wrap.appendChild(label);
    const chipRow = document.createElement('div');
    card.goDeeper.forEach(topic=>{
      const chip = document.createElement('button'); chip.className='deeper-chip'; chip.textContent = topic;
      chip.onclick = ()=>goDeeper(card, topic);

async function goDeeper(fromCard, topic){
  if(state.loading) return;
  state.loading = true;
  if(state.overlayView==='rabbit-hole'){
    showOverlayLoading('Diving into '+topic+'\u2026');
  } else {
    showToast('Diving into '+topic+'\u2026');
  }
  try{
    const card = await fetchTargeted('knowledge', topic, fromCard.hook);
    if(card.hook) state.seenTitles.push(card.hook);
    bumpAffinity(topic, 2);
    openOverlay('rabbit-hole', {
      chain: (state.overlayView==='rabbit-hole' && state.overlayData) ? state.overlayData.chain.concat([topic]) : [fromCard.hook, topic],
      card
    });
  }catch(e){ showToast('Could not load that, try again'); }
  state.loading = false;
}

function refreshCurrentView(){
  if(state.overlayView){ renderOverlay(); return; }
  renderHome();
}

function refreshCardInPlace(card, mode, builderFn){
  const el = document.querySelector('.snap-card[data-id="'+card.id+'"]');
  if(!el){ refreshCurrentView(); return; }
  const tag = el.querySelector('.snap-tag');
  const stats = el.querySelector('.stat-stars');
  const actionCol = el.querySelector('.action-col');
  [...el.children].forEach(ch=>{ if(ch!==tag && ch!==stats && ch!==actionCol) ch.remove(); });
  if(mode==='return'){
    const content = builderFn(card);
    if(actionCol) el.insertBefore(content, actionCol); else el.appendChild(content);
  } else {
    const temp = document.createElement('div');
    builderFn(card, temp);
    const frag = document.createDocumentFragment();
    while(temp.firstChild) frag.appendChild(temp.firstChild);
    if(actionCol) el.insertBefore(frag, actionCol); else el.appendChild(frag);
  }
}

function openOverlay(kind, data){
  state.overlayView = kind;
  state.overlayData = data;
  renderOverlay();
  document.getElementById('overlay').classList.remove('hidden');
}
function closeOverlay(){
  document.getElementById('overlay').classList.add('hidden');
  state.overlayView = null;
  state.overlayData = null;
  renderHome();
}
function showOverlayLoading(text){
  document.getElementById('overlay-body').innerHTML = '<p class="prompt-line">'+text+'</p>';
}

function renderOverlay(){
  const title = document.getElementById('overlay-title');
  const body = document.getElementById('overlay-body');
  body.innerHTML = '';
  if(state.overlayView==='rabbit-hole'){
    title.textContent = 'Rabbit Hole';
    const chain = state.overlayData.chain || [];
    if(chain.length){
      const bc = document.createElement('div'); bc.className='breadcrumb-row';
      chain.forEach(t=>{ const c = document.createElement('span'); c.className='breadcrumb-chip'; c.textContent = t; bc.appendChild(c); });
      body.appendChild(bc);
    }
    const card = state.overlayData.card;
    card.expanded = true;
    const cardEl = buildSnapCard(card);
    cardEl.style.marginBottom = '1rem';
    body.appendChild(cardEl);
  } else if(state.overlayView==='memory-review'){
    title.textContent = 'Memory Review';
    renderMemoryReviewOverlay(body);
  } else if(state.overlayView==='rarity-drill'){
    renderRarityDrillOverlay(body);
  }
}
function renderRarityDrillOverlay(body){
  const tier = state.overlayData.tier;
  const domain = state.overlayData.domain;
  document.getElementById('overlay-title').textContent = tier;
  const bankValues = Object.values(state.memoryBank);
  const tierItems = bankValues.filter(m=>m.rarity===tier);

  if(!domain){
    const head = document.createElement('p'); head.style.color='var(--text-soft)'; head.style.fontSize='0.85rem'; head.style.margin='0 0 1rem';
    head.textContent = tierItems.length + ' ' + tier.toLowerCase() + ' concept' + (tierItems.length===1?'':'s') + ' \u2014 tap a category to see them';
    body.appendChild(head);
    const domainCounts = [];
    KNOWLEDGE_MAP.forEach(d=>{
      const n = tierItems.filter(m=> d.id==='General' ? inGeneralBucket(m.category) : itemMatchesDomain(m.category, d)).length;
      if(n>0) domainCounts.push({label:d.id, color:d.color, glow:DOMAIN_GLOW[d.id]||'rgba(156,152,174,0.16)', count:n, ref:{kind:'domain', id:d.id}});
    });
    state.customCollections.forEach(cat=>{
      const n = tierItems.filter(m=>(m.category||'').toLowerCase()===cat.toLowerCase()).length;
      if(n>0) domainCounts.push({label:'\ud83c\udf10 '+cat, color:'#9C98AE', glow:'rgba(156,152,174,0.16)', count:n, ref:{kind:'custom', name:cat}});
    });
    if(domainCounts.length===0){
      const p = document.createElement('p'); p.style.color='var(--text-soft)'; p.style.fontSize='0.85rem'; p.textContent = 'Nothing here yet.';
      body.appendChild(p);
    } else {
      domainCounts.forEach(dc=>{
        const row = document.createElement('div'); row.className='memory-due-tile';
        row.style.background = 'radial-gradient(circle at 75% 15%, '+dc.glow+', transparent 60%), var(--surface)';
        row.innerHTML = '<span class="memory-due-dot" style="background:'+dc.color+'"></span><div style="flex:1"><div class="hub-title" style="font-size:0.92rem">'+dc.label+'</div></div><div style="color:var(--text-soft);font-size:0.85rem">'+dc.count+' \u203a</div>';
        row.onclick = ()=>{ state.overlayData.domain = dc.ref; renderOverlay(); };
        body.appendChild(row);
      });
    }
  } else {
    const domainDef = domain.kind==='domain' ? KNOWLEDGE_MAP.find(d=>d.id===domain.id) : null;
    const label = domain.kind==='custom' ? ('\ud83c\udf10 '+domain.name) : domain.id;
    const items = tierItems.filter(m=>{
      if(domain.kind==='custom') return (m.category||'').toLowerCase()===domain.name.toLowerCase();
      return domain.id==='General' ? inGeneralBucket(m.category) : itemMatchesDomain(m.category, domainDef);
    });
    const backRow = document.createElement('p'); backRow.style.fontSize='0.85rem'; backRow.style.color='var(--blue)'; backRow.style.margin='0 0 1rem'; backRow.style.cursor='pointer';
    backRow.textContent = '\u2039 All ' + tier + ' categories';
    backRow.onclick = ()=>{ state.overlayData.domain = null; renderOverlay(); };
    body.appendChild(backRow);
    const head = document.createElement('p'); head.style.fontWeight='700'; head.style.margin='0 0 0.8rem'; head.textContent = label + ' \u2014 ' + items.length;
    body.appendChild(head);
    const tierGlowColor = RARITY_COLOR[tier];
    const tierGlow = RARITY_GLOW[tier];
    items.sort((a,b)=>b.mastery-a.mastery).forEach(it=>{
      const row = document.createElement('div'); row.className='memory-due-tile'; row.style.cursor='default';
      row.style.background = 'radial-gradient(circle at 75% 15%, '+tierGlow+', transparent 60%), var(--surface)';
      row.innerHTML = '<span class="memory-due-dot" style="background:'+tierGlowColor+'"></span><div style="flex:1"><div class="hub-title" style="font-size:0.92rem">'+it.term+'</div></div><div style="color:var(--text-soft);font-size:0.85rem">'+stageOf(it.mastery)+' \u00b7 '+it.mastery+'%</div>';
      body.appendChild(row);
    });
  }
}

function buildTrivia(card){

  const wrapChoices = document.createElement('div');

    (card.choices||[]).forEach((choice,i)=>{
      const b = document.createElement('button'); b.className='choice-btn'; b.disabled = true;
      if(i===card.correctIndex) b.classList.add('correct');
      else if(i===card.answeredIndex) b.classList.add('incorrect');
      else b.classList.add('dim');
      b.textContent = choice; wrapChoices.appendChild(b);
    });
    holder.appendChild(wrapChoices);
    if(card.explanation){
      const exp = document.createElement('div'); exp.className='feedback'; exp.textContent = card.explanation; holder.appendChild(exp);
    }
    if(card.answeredIndex===card.correctIndex && state.triviaCurrentStreak>0){
      const banner = document.createElement('p'); banner.className='streak-banner';
      banner.textContent = state.triviaCurrentStreak+'-question streak';
      holder.appendChild(banner);
    }
  } else {
    (card.choices||[]).forEach((choice,i)=>{
      const b = document.createElement('button'); b.className='choice-btn'; b.textContent = choice;
      b.onclick = ()=>{
        card.answeredIndex = i; persistFeedUpdate(card);
        state.triviaTotal += 1;
        const correct = i===card.correctIndex;
        if(correct){
          state.triviaCorrect += 1; state.triviaCurrentStreak += 1;
          if(!card.appliesConceptKey) markLearned(card.hook, card.category, card.explanation, card.rarity);

        } else {
          state.triviaCurrentStreak = 0;
        }
        bumpDaily('trivia');
        bumpAffinity(card.category, correct?2:1);

        refreshCardInPlace(card, 'return', buildTrivia);
        requestAnimationFrame(()=>{

    holder.appendChild(wrapChoices);

function buildReviewCard(card){

  const barInner = document.createElement('div'); barInner.className='mastery-bar-inner'; barInner.style.width = card.mastery+'%';

        const b = document.createElement('button'); b.className='choice-btn'; b.disabled = true;

    fb.innerHTML = '<div class="corrected '+vClass+'">'+card.verdict+' recall</div>'+(card.feedback||'');
    holder.appendChild(fb);
    return holder;
  }

  if(!card.promptData){
    const loading = document.createElement('p'); loading.className='prompt-line'; loading.textContent = 'Loading your review\u2026';
    holder.appendChild(loading);
    return holder;
  }

  const q = document.createElement('p'); q.className='prompt-line'; q.textContent = card.promptData.question; holder.appendChild(q);

  if(card.promptData.mode==='mc'){
    const wrapChoices = document.createElement('div');

        card.verdict = correct ? 'Strong' : 'Weak';

        finishReview(card);
      };
      wrapChoices.appendChild(b);
    });

    const ta = document.createElement('textarea'); ta.placeholder = 'Type your answer\u2026'; holder.appendChild(ta);

      if(!val) return;
      btn.disabled = true; btn.textContent = 'Grading\u2026';
      try{
        const item = state.memoryBank[card.memKey];
        const graded = await gradeOpenAnswer(item, val);
        card.userAnswer = val; card.graded = true; card.verdict = graded.verdict; card.feedback = graded.feedback;
        finishReview(card);
      }catch(e){ btn.disabled=false; btn.textContent='Submit'; showToast('Could not grade, try again'); }
    };
    holder.appendChild(btn);
  }
  return holder;
}

function finishReview(card){
  const item = state.memoryBank[card.memKey];
  if(item){
    applyReviewResult(item, card.verdict);
    card.mastery = item.mastery;
  }
  recordAnswer(card.verdict==='Strong');
  bumpDaily('reviews');
  persistFeedUpdate(card);
  if(state.overlayView==='memory-review'){
    const cardEl = document.querySelector('.snap-card[data-id="'+card.id+'"]');
    if(cardEl){
      const tagRow = cardEl.querySelector('.snap-tag');
      cardEl.innerHTML = '';
      if(tagRow) cardEl.appendChild(tagRow);
      cardEl.appendChild(buildReviewCard(card));
    }
  } else {
    refreshCardInPlace(card, 'return', buildReviewCard);
  }
  requestAnimationFrame(()=>{
    const el = [...document.querySelectorAll('.snap-card')].find(e=>e.dataset.id===card.id);
    const anchor = el ? el.querySelector('.feedback') : null;
    const amount = card.verdict==='Strong' ? 20+Math.floor(Math.random()*10) : card.verdict==='Partial' ? 10+Math.floor(Math.random()*6) : 4;
    awardXP(amount, anchor);
    if(card.verdict==='Strong' && anchor){ const r = anchor.getBoundingClientRect(); burstConfetti(r.left+30, r.top); }
  });
}

function formatWhen(ts){
  const now = Date.now();
  const diff = ts - now;
  if(diff<=0) return 'Due now';
  const days = Math.round(diff/86400000);
  if(days<1) return 'Today';
  if(days===1) return 'Tomorrow';
  return 'In ' + days + ' days';
}

function setupObserver(){
  const sentinel = document.getElementById('sentinel');
  if(!sentinel) return;
  const obs = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{ if(entry.isIntersecting){ obs.disconnect(); loadMore(); } });
  }, {root:document.getElementById('view-home'), rootMargin:'1400px'});
  obs.observe(sentinel);
}

  const applyBtn = document.createElement('button'); applyBtn.className='primary'; applyBtn.style.marginTop='1.2rem'; applyBtn.style.width='100%';
  applyBtn.textContent = 'Update my feed';
